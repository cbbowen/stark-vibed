name: ci

on:
  # Automatic runs disabled for now because the build is slow.
  # push:
  #   branches: ['master']
  # pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Formatting, lints, and a wasm32 type-check of the frontend. No GPU needed, so
  # this stays fast and is the job that should go red on style regressions.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      # The toolchain (nightly + wasm32 target + rustfmt/clippy) comes from
      # rust-toolchain.toml; rustup honours it on first cargo invocation.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-ci-lint-${{ hashFiles('**/Cargo.lock') }}

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # stark-ui is excluded from default-members (it is a wasm app), so nothing
      # else in this workflow would compile it for its real target. `dx build` is
      # reserved for the pages deploy; a plain cargo check catches wasm-only
      # compile errors in a fraction of the time.
      - name: Check stark-ui (wasm32)
        run: cargo check -p stark-ui --target wasm32-unknown-unknown

  # The build **without** the Mixbox pigment space (§6.7) — the configuration that
  # links no CC BY-NC 4.0 code, so it is the one a commercial build would ship.
  #
  # Lint-shaped rather than a second test run: turning the feature off subtracts code
  # paths rather than changing any that remain, so what can break is compilation —
  # a `cfg` that left an accessor without its artifact, a helper used only by a gated
  # test, an `include_bytes!` still pointing at the vendored LUT.
  #
  # **Submodules are checked out here even so**, and that is a cargo constraint rather
  # than a choice: a `path` dependency's manifest is read while the dependency *graph*
  # is resolved, which happens before features select anything, so `vendor/mixbox` has
  # to exist for `cargo` to get as far as deciding not to build it. What the feature
  # controls is whether it is ever compiled — which is the claim that matters, and
  # which the `cargo tree` step below checks directly rather than by inference.
  no-mixbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-ci-nomixbox-${{ hashFiles('**/Cargo.lock') }}

      # The licence claim, stated against the build graph itself: with the feature
      # off, the vendored crate is not among the crates that get compiled.
      - name: The vendored crate is not in the build
        run: |
          if cargo tree -p stark-engine --no-default-features -e normal | grep -qi mixbox; then
            echo "the mixbox crate is still in the dependency graph without its feature" >&2
            cargo tree -p stark-engine --no-default-features -e normal | grep -i mixbox >&2
            exit 1
          fi

      # `--features stark-net/webrtc` puts back the *other* thing `--no-default-features`
      # takes away: stark-net's transport is a default feature too, and dropping it
      # here would make this job about two subtractions at once.
      - name: Clippy (no mixbox)
        run: cargo clippy --workspace --all-targets --no-default-features --features stark-net/webrtc -- -D warnings

      - name: Check stark-ui (wasm32, no mixbox)
        run: cargo check -p stark-ui --target wasm32-unknown-unknown --no-default-features --features stark-net/webrtc

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            target
          key: ${{ runner.os }}-ci-test-${{ hashFiles('**/Cargo.lock') }}

      # Software Vulkan (lavapipe), so the GPU half of the suite actually runs.
      # Without an adapter the golden / seam / dynamics / selection tests would
      # otherwise have nothing to render.
      - name: Install lavapipe
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
          vulkaninfo --summary || true

      # The official installer rather than a third-party action: one curl, no
      # marketplace dependency, and it is what nexte.st documents for CI.
      - name: Install nextest
        run: curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C "${CARGO_HOME:-$HOME/.cargo}/bin"

      # Covers the five crates/ members only — the vendored trees are excluded
      # from the workspace (see the root Cargo.toml), so their own test suites do
      # not run here.
      #
      # `--profile ci` adds the retries (`.config/nextest.toml`), and with them
      # `final-status-level = "flaky"`: a test that needed a retry is *reported* as
      # flaky rather than folded into the pass count, so this stays a way of seeing
      # the flake rather than a way of hiding it.
      - name: Test
        env:
          WGPU_BACKEND: vulkan
          # NOT set: STARK_ALLOW_NO_GPU. If lavapipe fails to produce an adapter
          # we want a loud failure, not a suite of vacuous passes.
          #
          # Goldens are blessed against whichever adapter the author develops on,
          # and a committed PNG can only match one adapter (see §9), so
          # comparing them here would fail on pixels rather than on behaviour.
          # The strokes are still rendered — shader compilation, wgpu validation
          # errors and panics are all still caught; only the pixel diff is
          # dropped.
          STARK_SKIP_GOLDEN: '1'
        run: cargo nextest run --workspace --profile ci

      # nextest cannot run doctests — there is no libtest protocol for them — so
      # they are a second command. It executes nothing today: `stark-engine`'s
      # three doc examples are all ```ignore blocks. Kept so that the first real
      # doctest anybody writes is *run* rather than collected by nobody, which is
      # the failure mode `STARK_ALLOW_NO_GPU` is left unset above to avoid.
      - name: Doctests
        env:
          WGPU_BACKEND: vulkan
          STARK_SKIP_GOLDEN: '1'
        run: cargo test --workspace --doc
