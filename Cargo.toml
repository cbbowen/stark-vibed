# Stark workspace. See CLAUDE.md for the architecture this layout implements.
[workspace]
resolver = "3"
members = [
    "crates/*",
]
# The vendored trees are path dependencies, and cargo makes an unexcluded path
# dependency a workspace *member* — which put third-party code in the blast radius
# of `cargo fmt --all` and `cargo clippy --workspace` (mixbox alone raises 45
# warnings we must not "fix"). They still build as dependencies; they are just not
# ours to lint. Each has a VENDORING.md.
exclude = [
    "vendor/mixbox",
    # WebRTC as an iroh custom transport (anchalshivank's crate; the `2` is
    # historical — an unrelated earlier project shared the name).
    "vendor/iroh-webrtc-transport",
    # iroh 1.0.3 + the custom-transport path-opening patch (see its
    # VENDORING.md); substituted for the crates.io version via [patch] below.
    "vendor/iroh",
    # wgpui 0.3.4 + the one-line manifest fix that lets it build on Windows at
    # all (see its VENDORING.md); substituted via [patch] below.
    "vendor/wgpui",
]
# stark-dioxus-frontend is a wasm/web app (Dioxus web + WebGPU); keep it out of
# the native default build/test so `cargo build`/`cargo test` stay host-only.
# Build it with `dx serve --platform web` or
# `cargo build -p stark-dioxus-frontend --target wasm32-unknown-unknown`.
#
# stark-wgpui-frontend *is* host-only — a winit window on a native wgpu device —
# so by that same rule it belongs in the default round, and is below.
default-members = [
    "crates/stark-assetid",
    "crates/stark-engine",
    "crates/stark-model",
    "crates/stark-net",
    "crates/stark-shaders",
    "crates/stark-wgpui-frontend",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.85"

# The lints every member inherits, via `[lints] workspace = true` in its manifest.
#
# The bar for a row here is that it costs **nothing today**: each was measured
# across `--workspace --all-targets` before being added, and either raised nothing
# or had its sites fixed in the same commit. They are ratchets — they cannot fail
# this build, only a later one.
#
# The lints deliberately *left out* carry as much of the argument as the ones kept,
# and the reason is always the same: a lint's count says how much work it is, never
# whether the work is worth doing. The cast family (949 warnings between
# `cast_precision_loss`, `cast_possible_truncation` and `cast_sign_loss`) is what
# pixel-and-index code is made of. `suboptimal_flops` pushes `mul_add`, which
# *changes the rounding* — a golden re-bless in exchange for nothing, and a slow
# software path where there is no hardware FMA. `float_cmp`'s fourteen sites are
# every one a deliberate exactness guard. `imprecise_flops` wants `hypot` on the
# stroke hot path to survive an intermediate overflow that bounded canvas
# coordinates cannot reach. Where a rejection belongs beside a lint that *is* here,
# it is written there instead.
#
# `warn` rather than `deny` because the gate is `-D warnings` at the CI edge
# (CLAUDE.md), which is where the default lints are already held.
[workspace.lints.rust]
# Stark has never needed `unsafe` — not one block, fn, impl or extern in ~130k
# lines — and that is worth stating where the compiler keeps it true rather than
# leaving it a property nobody wrote down. `forbid` rather than `deny` so it
# cannot be switched back off at a call site; the missing escape hatch is the
# whole point.
#
# It does not reach through an external proc macro's expansion: the generated
# shader mirrors carry `#[derive(bytemuck::Pod, Zeroable)]`, whose expansion *is*
# an `unsafe impl`, and this is green anyway. So the claim is "no unsafe we
# wrote", not "no unsafe in the build" — which is the claim worth making.
unsafe_code = "forbid"
# A `macro_rules!` metavariable used where its fragment specifier cannot reach.
meta_variable_misuse = "warn"
# `x as i32` where `x` is already `i32` — noise that hides the casts that mean
# something, of which this tree has 972.
trivial_numeric_casts = "warn"
# The same argument one step out: a cast doing work a coercion would have done.
# Both sites it found were an `as` on every element of an array literal, where
# annotating the binding once says it better.
trivial_casts = "warn"
# `&Foo` where `Foo` is `Foo<'a>`. Worth having in a tree whose central types are
# borrowed views over a `DocState` — a hidden lifetime is a hidden borrow.
elided_lifetimes_in_paths = "warn"

[workspace.lints.clippy]
# Debug leftovers, in a tree whose output is a browser tab somebody else loads.
dbg_macro = "warn"
todo = "warn"
# `Rc<String>`/`Rc<Vec<T>>`, which pays for two indirections to reach the bytes.
rc_buffer = "warn"
# Leaking a value whose `Drop` is load-bearing. Tile reclamation is Drop-shaped
# here — a `GpuTile` handle going out of scope is what returns it to the pool.
mem_forget = "warn"
# `x == 1.0` against a *literal*. The general `float_cmp` is deliberately absent:
# all 14 of its sites are exactness guards that mean it.
float_cmp_const = "warn"
# `#[expect]` over `#[allow]`, and a `reason` on both. An `allow` is permanent by
# construction: it goes silent the moment the thing it suppressed disappears, and
# so nothing ever removes it. An `expect` is the same suppression that reports
# itself once it is unnecessary — which is what "do not add inert scaffolding"
# (CLAUDE.md) asks of everything else in the tree, applied to the suppressions.
#
# It earned its place immediately: one of the eight `allow`s it found had already
# gone stale, and this is what said so.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# A loop whose counter is a float. Both sites this found stepped by an exactly
# representable amount and were fine — but they were fine by arithmetic nobody had
# checked, and both read better driven off an integer index anyway.
#
# `clippy::iter_with_drain` is deliberately *not* here, though it looks like a
# neighbour: its two hits are `drain(..)` on a `Vec` that is refilled on the next
# pass, which is what `drain` is for, and its suggested `into_iter()` does not
# compile — E0382, borrow of moved value.
while_float = "warn"
useless_let_if_seq = "warn"
# A `collect()` into a binding that is then read once. Two of its three sites
# built a whole `Vec` to ask it for `.len()`.
#
# `clippy::maybe_infinite_iter` is the other near neighbour not taken: both its
# hits are the `(1..).find(|n| the name is free)` behind "Gradient N" and
# "Preset N", which terminates after N+1 entries. Two `#[expect]`s, no finding.
needless_collect = "warn"
# An assert that fires should say which invariant broke. Every one of the nine
# this found already had a comment above it explaining exactly that — the message
# just moves it to where a failure will print it.
missing_assert_message = "warn"
# All seven of its sites were real — each removal compiles, which is the whole
# proof, since the borrow checker is what decides whether a clone was load-bearing.
# Three were on a render path.
#
# The one caveat worth leaving: this is a *nursery* lint, and the toolchain here
# floats on nightly, so a clippy update could bring a false positive to a gate
# that is `-D warnings`. If that happens the answer is an `#[expect]` at the site,
# not silence here — the seven fixes stand on their own either way.
redundant_clone = "warn"

# Single source of truth for shared dependency versions (CLAUDE.md).
[workspace.dependencies]
wgpu = "30"
glam = { version = "0.33", features = ["serde"] }
bytemuck = { version = "1", features = ["derive"] }
rpds = "1"
thiserror = "2"
pollster = "1"
# Oneshot for the async GPU readback (readback.rs). Already in the tree via wgpu;
# `default-features = false` keeps it to the channel itself.
futures-channel = { version = "0.3", default-features = false, features = ["std"] }
wesl = "0.4"
history = { git = "https://github.com/cbbowen/history" }
png = "0.18"
# The other export encoder (§15.6). Pure Rust, so it builds for wasm like `png`.
jpeg-encoder = "0.6"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
# The action log's encoding, on disk and on the wire (§8). Columnar, with the
# writer's schema carried beside the data — which is what lets an old file be
# reconciled against today's types by *name* instead of refused by version.
#
# `derive` builds every type's schema at compile time, so nothing in the document tree
# is discovered at runtime. That is not a speed choice: a schema can also be found by
# *tracing* a type's `Deserialize` impl, and an invariant funnel refuses the synthetic
# values tracing feeds it — so `FillOp`, `SelectionOp` and `Gradient` would have no
# schema at all. Each states its wire shape with `#[carbonite(as = "...")]` instead,
# which is what lets `Gradient::new` stay a refusal (§8).
#
# `glam` supplies the schemas for `Vec2`/`Affine2`/`IVec2`, which sit in the middle of
# the log through `geom` and which only carbonite can implement — the orphan rule puts
# a foreign trait on a foreign type out of reach here.
carbonite = { git = "https://github.com/cbbowen/carbonite", features = ["glam"] }
# Pure-Rust deflate (wasm-friendly): the save container's compression.
flate2 = "1"
# Structured logging/diagnostics; the frontend installs a console subscriber
# (tracing-wasm) so engine + UI traces show up in the browser devtools.
#
# `release_max_level_info` is why every timing span is `info_span!` and not the
# `trace_span!` its verbosity would suggest (`stark_engine::timing`): a release build
# compiles `debug!` and `trace!` away, and instrumentation the shipped app does not
# carry cannot answer a question about the shipped app.
tracing = { version = "0.1", features = ["release_max_level_info"] }
# The timing histograms behind `stark_engine::timing` (§7.1) — one per span name,
# read for its quantiles. `default-features = false` at the consumer, because the
# `sync` feature's cross-thread drain cannot run in a browser; see stark-engine's
# manifest for what that means.
hdrhistogram = { version = "7", default-features = false }
# Composing that layer with the console one. `default-features = false` because all
# either consumer needs is the span registry the layer stack is built on — the `fmt`
# subscriber and its ANSI colouring are for a terminal, and neither of Stark's two
# consumers (a browser tab, a benchmark that prints its own table) has one.
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "registry",
    "std",
] }

# stark-shaders is consumed by stark-engine.
stark-assetid = { path = "crates/stark-assetid" }
# The document itself (§2). Every other stark crate depends on it; it depends on
# none of them, which is the whole content of the split.
stark-model = { path = "crates/stark-model" }
# `default-features = false` is load-bearing: `stark-shaders`'s own default turns its
# `mixbox` feature on, and cargo unifies features across the graph — so without this,
# a `--no-default-features` workspace build would still compile the two Mixbox
# shaders and transpile the vendored GLSL, because stark-engine would go on asking for
# them regardless of its own feature. `stark-engine/mixbox` forwards it instead.
stark-shaders = { path = "crates/stark-shaders", default-features = false }
nalgebra = "0.35"


[profile.dev]
# Shaders and GPU work are unbearably slow without optimized dependencies.
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

# Vendored iroh with the custom-transport path-opening patch: without it, a
# connection that establishes over the relay can never migrate onto a custom
# transport (WebRTC). See vendor/iroh/VENDORING.md.
[patch.crates-io]
iroh = { path = "vendor/iroh" }
# Vendored wgpui with `flume` declared on Windows: upstream 0.3.4 uses it in
# `Executor::spawn_realtime` but declares it only for macOS/Linux/FreeBSD, so the
# published crate does not compile on Windows at all. See vendor/wgpui/VENDORING.md.
wgpui = { path = "vendor/wgpui" }
