# APIs that compile for wasm32 and then misbehave in a browser.
#
# This file exists for one failure mode: a call that the type checker, the test
# suite and both CI clippy jobs all wave through, and that fails only when a
# person loads the app. Nothing before a hand-run catches it, so it has to be
# caught at the name. The rows below are that list.
#
# `stark-model`, `stark-engine` and `stark-dioxus-frontend` all compile to wasm;
# `stark-net` does too. The benches, examples and native-only tests are the
# legitimate exceptions, and each carries an `#[expect(clippy::disallowed_types,
# reason = "...")]` that says so at the site — which is better than the silence
# there was before, because an `#[expect]` that stops being needed reports
# itself.

disallowed-types = [
  # `Instant::now()` panics on wasm32-unknown-unknown. This is the sharp one: the
  # `quanta` dependency exists precisely to replace it (it reads
  # `performance.now()` on the web and the invariant TSC natively), and
  # `stark_engine::timing` explains as much in prose — but prose does not fail a
  # build, and this had to be found by loading the app at least once already.
  { path = "std::time::Instant", reason = "panics in a browser; use quanta::Clock (§7.1, stark_engine::timing)" },
  # Same panic, same platform. No uses today — this row is a ratchet, not a fix.
  { path = "std::time::SystemTime", reason = "panics in a browser; there is no wall clock in the tab" },
]

disallowed-methods = [
  # Blocks the thread the whole UI is drawn on. Native tests may; the app may not.
  { path = "std::thread::sleep", reason = "blocks the browser's main thread; await a timer instead" },
]
