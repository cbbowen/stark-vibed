[package]
name = "spline-fit"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Least-squares cubic B-spline fitting, behind stark-core's path::PathFitter (DESIGN.md §6.2)."

[dependencies]
nalgebra = { workspace = true }
thiserror = { workspace = true }
num-traits = "0.2"

[dev-dependencies]
criterion = "0.8"

[features]
# Gates `#![feature(lazy_type_alias)]`. Note this does *not* gate nightly as a
# whole: `generic_const_exprs` is enabled unconditionally in lib.rs.
nightly = []

[[bench]]
name = "fit"
harness = false
