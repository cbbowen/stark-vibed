# What an asset *id* is, with nothing that renders one (§6.6, §6.4, §19).
#
# Split out of stark-engine so it can be depended on without wgpu: an id has to be
# computable by a build script, which is what lets the app know the id of a
# bundled ground before its bytes have been fetched. That it is also the file
# format's identity contract is the better reason — see the crate docs.
[package]
name = "stark-assetid"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Content ids and canonical encodings for Stark's brush shapes and canvas grounds."

[dependencies]
png = { workspace = true }
blake3 = { workspace = true }
serde = { workspace = true }
# An `AssetId` is a field of the save format's bundle, so it needs a compile-time
# schema like everything else in the log (§8) — and the orphan rule means only this
# crate can give it one. No GPU, no build-script cost: carbonite is serde + thiserror.
carbonite = { workspace = true }
thiserror = { workspace = true }
