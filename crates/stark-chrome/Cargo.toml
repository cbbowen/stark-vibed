[package]
name = "stark-chrome"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "Frontend-agnostic UI model for Stark (§11.2): what both frontends' chrome is written in."

[dependencies]
# What a content id *is* — the asset libraries' thumbnails are a reduction of the
# same canonical field an id is taken over (§19), at a card's size rather than the
# format's cap.
stark-assetid = { workspace = true }
# The document (§2). Almost everything here is arithmetic over its types.
stark-model = { workspace = true }
# The derived view, for the projections the chrome reads back — `LayerInfo` above
# all. `default-features = false` because nothing here has an opinion about the
# color space: Mixbox (§6.7) is a fact about the renderer, not about a panel.
stark-engine = { path = "../stark-engine", default-features = false }
# The brush's two halves are what a preset stores, so they are `Serialize` — the
# one place this crate's types reach a file (§25.6).
serde = { workspace = true }

# The shared lint set (root Cargo.toml).
[lints]
workspace = true
