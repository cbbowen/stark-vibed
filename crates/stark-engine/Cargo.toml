[package]
name = "stark-engine"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "Frontend-agnostic GPU painting engine for Stark (CLAUDE.md)."

[dependencies]
wgpu = { workspace = true }
glam = { workspace = true }
bytemuck = { workspace = true }
rpds = { workspace = true }
thiserror = { workspace = true }
history = { workspace = true }
serde = { workspace = true }
postcard = { workspace = true }
flate2 = { workspace = true }
png = { workspace = true }
blake3 = { workspace = true }
tracing = { workspace = true }
# Where a frame's time goes (`timing`, §7.1). A regular dependency, not a dev one:
# the histograms are collected in the shipped app, because a profile you have to
# rebuild to collect is a profile of a build nobody is using.
#
# `default-features = false` drops `sync` and `serialization`, and the first of those
# is load-bearing rather than a diet: `SyncHistogram`'s cross-thread drain calls
# `std::time::Instant::now()`, which *panics* on wasm32-unknown-unknown ("time not
# implemented on this platform"). `timing` owns its own tracing layer for exactly
# that reason, so the plain `Histogram` is all it needs — and the browser build sheds
# `crossbeam-channel` with it.
hdrhistogram = { workspace = true }
tracing-subscriber = { workspace = true }
# The clock behind those histograms: the samples, the window and the reported
# resolution all come off one `quanta::Clock` the layer owns. `performance.now()` on
# the web and the TSC natively — and, unlike `std::time::Instant`, it exists on
# wasm32-unknown-unknown at all, which is the whole reason it is here by name.
quanta = "0.12"
futures-channel = { workspace = true }
stark-shaders = { workspace = true }
stark-assetid = { workspace = true }
nalgebra = { workspace = true }
# Vendored as a git submodule (CC BY-NC 4.0); see vendor/mixbox/LICENSE. Pure
# no_std + libm, so it builds for wasm. Backs the Mixbox color space (§6.7).
# Optional, and the reason the `mixbox` feature exists: without it this is not
# compiled and the submodule need not be checked out.
mixbox = { path = "../../vendor/mixbox/rust", optional = true }

[features]
default = ["mixbox"]
# The Mixbox pigment color space (§6.7). On by default.
#
# Off, the build carries **no CC BY-NC 4.0 code at all**: the vendored crate is not
# compiled, `stark-shaders` skips transpiling the polynomial out of the submodule and
# does not build the two shaders that import it, and `vendor/mixbox` need not exist.
# That is the point of the flag — the licence is non-commercial, so a commercial
# build has to be able to leave it out entirely rather than merely not reach it.
#
# `ColorSpaceId::Mixbox` is **still a variant** in such a build, deliberately.
# Postcard encodes enums by index (§8), so dropping it would renumber every variant
# appended after it and two builds would disagree about the save format — the class
# of silent divergence §19 exists to prevent. The id stays nameable and
# serializable; what goes away is the implementation, and
# `ColorSpaceId::make` returns `None` so opening such a document is a clean
# `EngineError::UnsupportedColorSpace` rather than a decode failure.
#
# The residual channel goes with it, because a residual is something a *pigment*
# space has and this is the only one: no space declares a `resid_format`, the eight
# `_resid` shader variants are not built, and the loop's storage-texture requirement
# drops back to WebGPU's guaranteed four.
mixbox = ["dep:mixbox", "stark-shaders/mixbox"]
# Stroke-fitting debug aids. Build-time only: there is no command and no UI toggle
# for these, so a build without the feature has no code path that reaches them.
# Turn it on (`--features debug-unfrozen`) while working on the fit.
#
#  * The live tail of an in-flight stroke is tinted magenta — the part the engine
#    repaints on every pointer move, so the seam is the freezing boundary
#    (§6.2). It only ever changes the preview, never what commits.
#  * Every finished stroke logs its raw input samples as a pasteable Rust
#    literal, so a stroke that misfits in the app can be turned into a test.
#
# The tint makes the live preview differ from the committed stroke by design, so
# the preview-vs-commit tests are gated off when it is on (`tests/stroke.rs`).
debug-unfrozen = []

[[bench]]
name = "path"
harness = false

[[bench]]
name = "stroke"
harness = false

[dev-dependencies]
pollster = { workspace = true }
# Statistical benchmarking for the stroke path (benches/). `--save-baseline` /
# `--baseline` is the regression gate: the GPU numbers are only comparable to
# other runs on the *same* machine and adapter, so an absolute threshold would be
# meaningless and only a before/after on one box means anything.
criterion = { version = "0.8", features = ["html_reports"] }
# Synthesizing oversized brush-shape PNGs in tests/assets.rs (already a regular dep).
png = { workspace = true }
# Recorded pen input for the fitter tests. A dev-dependency on purpose: as a module
# it was public API and rode along in the wasm binary.
stark-testdata = { path = "../stark-testdata" }
