# iroh transport for shared multi-user drawings (DESIGN.md §12.4). Adapts the
# wire (mesh-broadcast live actions + a catch-up/asset ALPN) to stark-core's
# network-agnostic ReplicatedTimeline; pulled in by the frontend, or omitted.
[package]
name = "stark-net"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[features]
# Direct peer connections on the web target via the vendored WebRTC facade
# (vendor/iroh-webrtc-transport). On the web iroh cannot hole-punch, so all
# traffic otherwise crosses n0's relays; WebRTC gives lower-latency direct paths
# with automatic relay fallback per connection.
#
# The blocker this used to carry is gone: the live wire is now `crate::mesh`,
# which is built on explicit dial/accept and so *can* run over the facade
# (iroh-gossip could not — it is a self-dialing swarm). `transport::webrtc`
# implements the mesh's WebRTC binding and is compiled by this feature.
#
# Not yet switched on at the session level: `CollabSession` still constructs the
# iroh transport on every target, because moving it onto the facade also means
# serving the catch-up/asset ALPN through the facade (it owns its endpoints and
# exposes no `Endpoint`/`Router`), and none of that is verifiable outside a
# browser. See vendor/iroh-webrtc-transport/VENDORING.md.
webrtc = ["dep:iroh-webrtc-transport"]

[dependencies]
stark-core = { path = "../stark-core" }
iroh = "1"
n0-future = "0.3"
postcard = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { version = "1", default-features = false, features = ["sync"] }
data-encoding = "2"

# The web target is what WebRTC is for; pull in the browser facade there.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies.iroh-webrtc-transport]
path = "../../vendor/iroh-webrtc-transport"
optional = true
default-features = false
features = ["browser"]

# Native iroh already establishes direct connections, so WebRTC isn't needed
# host-side; build the native backend anyway so the feature compiles for
# tests/dev.
[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies.iroh-webrtc-transport]
path = "../../vendor/iroh-webrtc-transport"
optional = true
default-features = false
features = ["native"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
pollster = { workspace = true }
wgpu = { workspace = true }
glam = { workspace = true }
