# iroh transport for shared multi-user drawings (§12.4). Adapts the
# wire (gossip-broadcast live actions + a catch-up/asset ALPN) to stark-engine's
# network-agnostic ReplicatedTimeline; pulled in by the frontend, or omitted.
[package]
name = "stark-net"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[features]
# Direct peer connections on ONE ordinary iroh endpoint via a WebRTC custom
# transport (vendor/iroh-webrtc-transport + the patched vendor/iroh). The
# default iroh backend gains a custom transport, a JSEP signaling ALPN, and a
# per-gossip-neighbor bootstrap (transport/direct.rs). Connections establish over
# whatever works (relay on the web) and MIGRATE onto the WebRTC path once a
# data channel attaches — with the relay path kept open as fallback. Works
# identically on native (str0m) and wasm (RTCPeerConnection), so the whole
# flow is testable in `cargo test`.
#
# `iroh/unstable-custom-transports` is listed for intent only: the `iroh`
# dependency below already enables it unconditionally (see the comment there).
webrtc = ["dep:iroh-webrtc-transport", "dep:anyhow", "iroh/unstable-custom-transports"]
# There is no `mixbox` feature here any more, and its absence is the point (§2).
# It existed only to forward `stark-engine/mixbox`: this crate depended on the
# engine with `default-features = false`, which would otherwise have pinned the
# Mixbox space *off* for every frontend. Now the library depends on `stark-model`,
# which has no such feature — `ColorSpaceId` is unconditional there — so there is
# nothing left to forward.
default = ["webrtc"]

[dependencies]
# The document: the action log, the save format and the presence frames — the whole
# of what this crate moves (§2). It names no engine type at all, which is why the
# engine is a *dev*-dependency below: transporting a log needs no renderer.
stark-model = { workspace = true }
# `unstable-custom-transports` unconditionally, not only under `webrtc`: besides
# the custom-transport API that feature uses, it gates the patched
# `Endpoint::add_addr` (vendor/iroh), which joining uses to teach the endpoint
# every member a ticket names before gossip bootstraps from all of them.
iroh = { version = "1", features = ["unstable-custom-transports"] }
# The live-edit wire: epidemic broadcast on the session topic. Rides the same
# endpoint as everything else — which is what the WebRTC custom-transport
# design (see the `webrtc` feature) exists to allow.
iroh-gossip = { version = "0.101", default-features = false, features = ["net"] }
# Brush-asset transfer: content-addressed, hash-verified blob fetches on the
# same endpoint. No fs-store — assets are small PNGs, kept in memory.
iroh-blobs = { version = "0.103", default-features = false }
# Gossip broadcast takes `Bytes`.
bytes = "1"
# The session log, so that handing it to a joiner is a refcount bump rather than a
# deep clone under the lock the receive loop takes per action (see `mirror`).
rpds = { workspace = true }
# The upstream package kept the name of an unrelated earlier project (see
# vendor/iroh-webrtc-transport/VENDORING.md); the `2` disambiguates in code.
iroh-webrtc-transport = { path = "../../vendor/iroh-webrtc-transport", optional = true }
# For naming `CustomAddr` and `TransportAddr`, which iroh does not re-export: the
# vendored transport's negotiation needs the first, and a session link spells every
# way to reach a peer in primitives (`ticket`), which needs both. Not optional,
# because a link's shape must not depend on a cargo feature (§8, §19) — iroh depends
# on this crate regardless.
iroh-base = { version = "1" }
# The vendored transport's negotiation API speaks anyhow.
anyhow = { version = "1", optional = true }
n0-future = "0.3"
# The wire's encoding, the same one the save format uses (§8, §12.4).
carbonite = { workspace = true }
# Deflate, for the same reason the save container uses it (§8): carbonite is
# columnar, and columns compress. A session link is the one place that matters to a
# person rather than to a disk — it is a string they paste, and every character of it
# is one they have to carry (`ticket`).
flate2 = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { version = "1", default-features = false, features = ["sync"] }
data-encoding = "2"

[dev-dependencies]
# Only the tests drive a real engine — they paint, render and compare pixels to
# prove a session converges. The library itself never sees one.
stark-engine = { path = "../stark-engine", default-features = false }
# `test-utils` provides the local relay server for the webrtc migration test.
iroh = { version = "1", features = ["test-utils"] }
# `test-util` pauses the clock: the asset retry backoff widens to half a minute,
# so `content`'s tests would otherwise measure tokio rather than the policy.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "test-util"] }
pollster = { workspace = true }
wgpu = { workspace = true }
glam = { workspace = true }
# Synthesizing brush-shape PNGs for the mid-session asset replication test.
png = { workspace = true }
# Deriving a substrate's content id without a GPU, which is what lets a test promise
# content the way the frontend's build-time manifest does.
stark-assetid = { workspace = true }
# The real rough height map, for the substrate-replication test. A synthetic one
# would do the job less well: the deposition tooth reads the substrate's *histogram*
# (§6.4), and a smooth synthetic blob has almost none of one, so a peer left on
# the flat stand-in could still land within tolerance.
stark-testdata = { path = "../stark-testdata" }

# The shared lint set (root Cargo.toml).
[lints]
workspace = true
