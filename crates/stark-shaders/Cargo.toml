[package]
name = "stark-shaders"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["mixbox"]
# The Mixbox pigment space (§6.7). On by default; turning it off skips the transpile
# of the vendored GLSL polynomial, which leaves the shaders that import it unbuildable
# and so unbuilt — and with no pigment space in the build there is nothing that could
# select a residual, so the whole `_resid` pass goes too, along with the `Resid::With`
# that would have named one.
#
# Nothing lists any of that: `build.rs` reads `CARGO_FEATURE_MIXBOX` (a build script is
# compiled without the crate's own features, so `cfg(feature = ..)` is not available
# there) and the rest follows from the shader tree. The accessors this crate exposes
# are generated from the same pass, so the two sides cannot disagree about which
# artifacts exist.
mixbox = []

# WESL sources are linked/compiled in build.rs and embedded by `include_wesl!`, which
# is this crate's own one-line macro: `wesl`'s is the same `include_str!`, and taking
# it would put the whole WESL compiler in the engine's graph — and in every wasm
# build of it — for a macro that names a file.
[dependencies]
# Both for the generated host mirrors (`src/lib.rs`'s `mirror`): `bytemuck` for the
# derives, `wgpu` for the vertex attribute arrays. A vertex buffer layout is derived
# from a shader's parameter list, so it belongs to this crate — and the types it needs
# are plain data, no device and no runtime.
bytemuck = { workspace = true }
wgpu = { workspace = true }

[build-dependencies]
# The whole of `build.rs`'s work — the linker, the type check and the mirror generator.
# Build-only: nothing of it reaches this crate's own graph, so `wesl`, `naga`, `syn` and
# `quote` are not in it either.
stark-shaders-build = { path = "../stark-shaders-build" }

# The shared lint set (root Cargo.toml).
[lints]
workspace = true
