[package]
name = "stark-shaders"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[features]
default = ["mixbox"]
# The Mixbox pigment space (§6.7). On by default; turning it off drops
# `blend_mixbox`/`media_mixbox` from [`ENTRY_POINTS`], skips the transpile of the
# vendored GLSL polynomial, and skips the whole `_resid` build pass — because the
# residual channel exists only for a pigment space, and Mixbox is the only one.
#
# `build.rs` cannot read `cfg(feature = ...)` — a build script is compiled without
# the crate's features — so it reads `CARGO_FEATURE_MIXBOX` instead. The two must
# agree, and `entry_points.rs` is the one place that decides for both.
mixbox = []

# WESL sources are linked/compiled in build.rs and embedded via `include_wesl!`.
[dependencies]
# Both for the generated host mirrors (`src/lib.rs`'s `mirror`): `bytemuck` for the
# derives, `wgpu` for the vertex attribute arrays. A vertex buffer layout is derived
# from a shader's parameter list, so it belongs to this crate — and the types it needs
# are plain data, no device and no runtime.
bytemuck = { workspace = true }
wgpu = { workspace = true }
wesl = { workspace = true }

[build-dependencies]
# `eval` for the type resolver and the WGSL size/alignment tables the mirrors are
# laid out from. Build-only: the resolver keeps build-dependency features separate,
# so the library above does not carry it.
wesl = { workspace = true, features = ["eval"] }
# The **type checker** (`build.rs::typechecks`). `wesl`'s own `validate` resolves
# names and checks call arity; it does not typecheck, so a `Sweep` handed to a
# parameter expecting a `vec3<f32>` linked cleanly and failed at
# `create_shader_module` — on a GPU, in the half of the suite CI cannot diff. This is
# the same front end `wgpu` runs there, run at build time instead. Already in the
# graph (wgpu 30 is built on it), so it costs a compile of what is downloaded anyway.
naga = { version = "30", default-features = false, features = ["wgsl-in"] }
# Emitting the host mirrors (`build/mirror.rs`). `quote` builds the code as tokens
# rather than as text, and `prettyplease` renders it readably — which matters here
# because the lane documentation the generator carries over is meant to be read.
# `default-features = false` drops the bridge to the compiler's `libproc_macro`,
# which only exists inside a real macro expansion and is dead weight in a script.
prettyplease = "0.2"
proc-macro2 = { version = "1", default-features = false }
quote = { version = "1", default-features = false }
syn = { version = "2", default-features = false, features = ["full", "parsing", "printing"] }
