# Recorded pointer input for stark-engine's fitter tests. A separate crate so 57 KB
# of stroke literals stay out of the engine's public API and out of the wasm the
# browser downloads — they are a dev-dependency of stark-engine, not part of it.
[package]
name = "stark-testdata"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Recorded pen input, captured from the app, for Stark's stroke-fitting tests."

[dependencies]
# To derive a bundled asset's content id the same way `stark-ui/build.rs` does, so a
# harness can resolve a lean document's ids out of the app's own assets. No GPU, which
# is the whole reason the derivation lives in its own crate (§19).
stark-assetid = { path = "../stark-assetid" }

# The shared lint set (root Cargo.toml).
[lints]
workspace = true
