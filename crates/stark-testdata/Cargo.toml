# Fixtures no single crate's tests can own: recorded pointer input for the fitter,
# the app's bundled assets by path, and the document vocabulary's roster. A separate
# crate so 57 KB of stroke literals stay out of the engine's public API and out of
# the wasm the browser downloads — they are a dev-dependency, not part of it.
[package]
name = "stark-testdata"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false
description = "Fixtures shared by more than one crate's tests: recorded pen input, bundled assets, the action vocabulary."

[dependencies]
# To derive a bundled asset's content id the same way `stark-dioxus-frontend/build.rs`
# does, so a harness can resolve a lean document's ids out of the app's own assets. No
# GPU, which is the whole reason the derivation lives in its own crate (§19).
stark-assetid = { path = "../stark-assetid" }

# For `vocabulary`, the one exhaustive match over `ActionKind` the suites hold. The
# model is the lightest crate that declares it — no wgpu, no build script — so this
# stays a dependency the browser never sees.
stark-model = { workspace = true }

# The shared lint set (root Cargo.toml).
[lints]
workspace = true
