[package]
name = "stark-ui"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "Frontend-agnostic UI model for Stark (§11.2): what both frontends' chrome is written in."

[dependencies]
# What a content id *is* — the asset libraries' thumbnails are a reduction of the
# same canonical field an id is taken over (§19), at a card's size rather than the
# format's cap.
stark-assetid = { workspace = true }
# The document (§2). Almost everything here is arithmetic over its types.
stark-model = { workspace = true }
# The derived view, for the projections the chrome reads back — `LayerInfo` above
# all. `default-features = false` because nothing here has an opinion about the
# color space: Mixbox (§6.7) is a fact about the renderer, not about a panel.
stark-engine = { path = "../stark-engine", default-features = false }
# Encoding an import (`assets`). The decode is each frontend's — the browser has one
# and a native build ships one — but what an image *becomes* is decided here, and it
# leaves as a PNG because that is the form both engines' importers take.
png = { workspace = true }
# The brush's two halves are what a preset stores, so they are `Serialize` — the
# one place this crate's types reach a file (§25.6).
serde = { workspace = true }
# The one format every stored record is kept in (§25.6). Self-describing, so a value
# stored by an older build reconciles against today's types by name — the save file's
# bargain (§8) at client scale.
serde_json = "1"
# Damage is reported and carried on from, never returned: a warning is the whole of
# what a caller could do about a record it cannot read.
tracing = { workspace = true }

# The shared lint set (root Cargo.toml).
[lints]
workspace = true

# The shipped assets' content ids, computed at build time (`build.rs`) — which is
# what `stark-assetid` is shaped for: no GPU, no wgpu, so a build script can hash
# one and the app knows an id before it has the bytes (§19).
[build-dependencies]
stark-assetid = { workspace = true }
