[package]
name = "stark-ui"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "Dioxus web frontend for Stark (DESIGN.md §11): WASM backend + WebGPU surface."

[dependencies]
stark-core = { path = "../stark-core" }
# Shared multi-user drawings over iroh (DESIGN.md §12.4). In the browser iroh
# runs over its relay (WebSocket) transport — same code path as native.
stark-net = { path = "../stark-net" }
dioxus = { version = "0.7.9", features = ["web", "asset"] }
wgpu = { workspace = true }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", version = "0.0.1", default-features = false }
tracing = { workspace = true, features = ["max_level_debug"] }

# Web platform glue (the crate targets wasm32 via `dx serve --platform web`).
# [target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "PointerEvent",
    # The app's shortcuts are bound to the window rather than to an element
    # (platform::on_window_key), so they read raw KeyboardEvents — and ask the
    # event's target whether it is a field being typed into (input::bind_shortcuts).
    "KeyboardEvent",
    "HtmlElement",
    # The presence clock (collab.rs). Monotonic, unlike `Date.now()`, which is what
    # peer timeouts and heartbeats need.
    "Performance",
    # Session tickets ride the URL fragment (collab.rs): read it to auto-join,
    # replaceState to reflect/clear it without adding history entries.
    "Location",
    "History",
    # "Copy link" in the share dialog (collab.rs).
    "Navigator",
    "Clipboard",
    # This browser's durable client identity (identity.rs).
    "Storage",
    # Save / open / export (platform.rs): a download is a Blob behind an object
    # URL on a synthetic <a download>; opening is a hidden <input type=file>
    # whose bytes come back through FileReader.
    "Blob",
    "BlobPropertyBag",
    "Url",
    "HtmlAnchorElement",
    "HtmlInputElement",
    "File",
    "FileList",
    "FileReader",
    "ProgressEvent",
    "EventTarget",
] }
console_error_panic_hook = "0.1"
# Routes `tracing` events to the browser console (set as the global subscriber).
tracing-wasm = "0.2"
