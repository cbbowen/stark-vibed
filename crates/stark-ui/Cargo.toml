[package]
name = "stark-ui"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "Dioxus web frontend for Stark (§11): WASM backend + WebGPU surface."

[features]
default = ["mixbox", "webrtc"]
# Offer the Mixbox pigment space (§6.7) and credit it. Forwarded to the engine,
# which is where turning it off actually drops the vendored CC BY-NC 4.0 code —
# see `stark-engine`'s own `mixbox` feature for what that means.
mixbox = ["stark-engine/mixbox"]
webrtc = ["stark-net/webrtc"]

[build-dependencies]
# Hashing the bundled shapes and substrates into their content ids at build time
# (build.rs). The whole reason that crate is separate from stark-engine: an id has
# to be computable without linking a GPU renderer.
stark-assetid = { workspace = true }

[dependencies]
stark-assetid = { workspace = true }
# The document (§2), depended on directly rather than through the engine: a type
# has one public path, and re-exporting the model here would give every one of them
# two.
stark-model = { workspace = true }
stark-engine = { path = "../stark-engine", default-features = false }
stark-net = { path = "../stark-net", default-features = false }
dioxus = { version = "0.7.10", features = ["web", "asset"] }
wgpu = { workspace = true }
tracing = { workspace = true, features = ["max_level_debug"] }
# Composing the console layer with the engine's timing layer over one registry
# (`main::install_tracing`, §7.1) — the two are exact complements, so neither can
# be installed with `set_as_global_default` alone.
tracing-subscriber = { workspace = true }
# Brush presets and the ⚙ dialog's settings persist to localStorage as JSON
# (presets.rs, prefs.rs): text, so a stored value is legible in devtools and
# editable by hand, which a browser-local table is worth. The save format
# reconciles by name too now (§8), so this is no longer the only door that does.
# Both already in the tree via dioxus.
serde = { workspace = true }
serde_json = "1"
# Encoding a brush shape's coverage as the gallery's thumbnail (shapes.rs): the
# card has to show a *field*, not the file it was authored from, and that means
# an alpha channel the source may not have had. Already in the wasm build under
# `stark-assetid`, which is where the matching decode lives.
png = { workspace = true }

# Web platform glue (the crate targets wasm32 via `dx serve --platform web`).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    # Measuring the panel stack at drag start (platform::panel_boxes): the panels
    # are read off the DOM in DOM order, which is the visible panel order.
    "NodeList",
    "Node",
    "DomRect",
    "HtmlCanvasElement",
    "PointerEvent",
    # The app's shortcuts are bound to the window rather than to an element
    # (platform::on_window_key), so they read raw KeyboardEvents — and ask the
    # event's target whether it is a field being typed into (input::bind_shortcuts).
    "KeyboardEvent",
    "HtmlElement",
    # Where a focusout sent the focus (platform::focus_stays_within): the command
    # search's palette holds a text field, so "a child blurred" is not yet "the
    # pointer went elsewhere" — only the event's relatedTarget can tell the two apart.
    "FocusEvent",
    # The presence clock (collab.rs). Monotonic, unlike `Date.now()`, which is what
    # peer timeouts and heartbeats need.
    "Performance",
    # Session tickets ride the URL fragment (collab.rs): read it to auto-join,
    # replaceState to reflect/clear it without adding history entries.
    "Location",
    "History",
    # "Copy link" in the share dialog (collab.rs).
    "Navigator",
    "Clipboard",
    # This browser's durable client identity (identity.rs).
    "Storage",
    # The blob store (platform::blob_put, §25.6): a brush shape's PNG is bytes, and
    # `Storage` above is text and a few megabytes of it shared across every record
    # this browser keeps. `IdbVersionChangeEvent` is not listed — the upgrade is
    # read as a plain `Event`, since the one thing done inside it is reached
    # through the request rather than through the version numbers.
    "IdbFactory",
    "IdbOpenDbRequest",
    "IdbRequest",
    "IdbDatabase",
    "IdbTransaction",
    "IdbTransactionMode",
    "IdbObjectStore",
    # Save / open / export (platform.rs): a download is a Blob behind an object
    # URL on a synthetic <a download>; opening is a hidden <input type=file>
    # whose bytes come back through FileReader.
    "Blob",
    "BlobPropertyBag",
    "Url",
    "HtmlAnchorElement",
    "HtmlInputElement",
    "File",
    "FileList",
    "FileReader",
    "ProgressEvent",
    "EventTarget",
    # Importing custom brush shapes (platform::normalize_shape_image): the
    # browser decodes any image format it knows into a canvas, we normalize the
    # pixels (downscale, dark-on-light inversion) and re-encode as PNG.
    # The same route places an imported or pasted image (platform::decode_image,
    # §23) — the browser is the decoder, so every format it can display can be
    # placed, and `getImageData` hands back exactly the un-premultiplied sRGB the
    # action carries.
    "CanvasRenderingContext2d",
    "ImageBitmap",
    "ImageData",
    # Pasting an image (platform::on_window_paste): the `paste` event rather than
    # `navigator.clipboard.read()`, which prompts for a permission and does not
    # carry images in every engine.
    "ClipboardEvent",
    "DataTransfer",
    "DataTransferItem",
    "DataTransferItemList",
] }
console_error_panic_hook = "0.1"
# Routes `tracing` events to the browser console (set as the global subscriber).
tracing-wasm = "0.2"

# The shared lint set (root Cargo.toml).
[lints]
workspace = true
