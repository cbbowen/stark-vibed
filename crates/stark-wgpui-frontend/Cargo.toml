[package]
name = "stark-wgpui-frontend"
version = "0.0.0"
edition.workspace = true
license.workspace = true
description = "Native wgpui frontend for Stark (§11): a winit/wgpu window over the same engine."

[features]
default = ["mixbox"]
# Offer the Mixbox pigment space (§6.7) and forward it to the engine, which is where
# turning it off actually drops the vendored CC BY-NC 4.0 code. The same switch the
# web frontend carries, spelled the same way — and `device_descriptor` asks the
# device for what *this* build needs, so the two cannot disagree.
mixbox = ["stark-engine/mixbox"]

[dependencies]
# The document (§2), depended on directly rather than through the engine, for the
# reason `stark-dioxus-frontend` gives: a type has one public path.
stark-model = { workspace = true }
# The frontend's model, shared with the web app (§11.2): the record format and the
# keys it keeps them under, and — as this frontend grows — the brush, the layer tree
# and the rest of what a chrome is written in.
stark-chrome = { path = "../stark-chrome" }
# The records this frontend keeps are serde structs like every other (§25.6).
serde = { workspace = true }

# The engine, with the same feature stance the web frontend takes: Mixbox on by
# default (§6.7), forwarded, so a build that must carry no CC BY-NC 4.0 code can
# drop it here exactly as it can there.
#
# That was not a choice until now. wgpui creates the wgpu device, and it asked for
# `wgpu::Limits::default()` — four storage textures per stage, where the Mixbox
# stamp loop writes six — so the space was unreachable from this frontend whatever
# the feature said. `main::device_descriptor` states the limits now, over a
# vendored patch that threads a `DeviceDescriptor` down (vendor/wgpui).
stark-engine = { path = "../stark-engine", default-features = false }
# The fork of GPUI that renders through wgpu, which is the whole reason it is the
# toolkit here: `WgpuSurface` puts the engine's own texture in the element tree,
# so the canvas is composited rather than copied.
wgpui = "0.3.4"
# Must be the major version wgpui is built against (30) or the `Device`, `Queue`
# and `TextureView` types it hands over will not unify with the engine's.
wgpu = { workspace = true }
# The clock a pointer sample is stamped from. `std::time::Instant` is disallowed
# workspace-wide (clippy.toml) because it panics in a browser — this binary never
# runs in one, but the tree has one clock and this is it (§7.1). Already compiled
# here by way of the engine's timing layer.
quanta = "0.12"
# The decoder half of an asset import (§6.4, §6.6). The browser is the web
# frontend's — any format it can display can become a brush shape — and this is the
# native equivalent, cut to the formats worth the compile: the raster ones a person
# is likely to have a texture or a scanned brush in. What the pixels then *mean* is
# `stark_chrome::assets`, so this crate decodes and resamples and decides nothing.
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "webp",
    "gif",
    "bmp",
    "tiff",
] }
# Reading the asset libraries at startup, which is the one place this binary has to
# finish a future before it can go on: the brush the app opens on may name a stamp,
# and a preset that resolved *after* the first frame would paint one stroke round.
# The backend behind it is synchronous file I/O (`crate::store`), so this parks on
# nothing — it is an adapter, not an executor.
pollster = "0.4"

[dev-dependencies]
# Round-tripping a record in a test. The format is `stark-chrome`'s at run time,
# so this is here to *check* one rather than to write one.
serde_json = "1"
# Re-deriving a shipped asset's id in a test, to check that the bytes in the binary
# are the bytes the id table was built from (`assets`).
stark-assetid = { workspace = true }

# The shared lint set (root Cargo.toml).
[lints]
workspace = true
