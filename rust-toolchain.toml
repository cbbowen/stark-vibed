# Nightly is required twice over: the `history` dependency uses
# #![feature(associated_type_defaults)], and `spline-fit` uses
# #![feature(generic_const_exprs)] for its `{P + 1}` basis-matrix arithmetic.
# See CLEANUP.md §2.1 — retiring the latter would leave only `history`.
[toolchain]
channel = "nightly"
targets = ["wasm32-unknown-unknown"]
# Pinned here rather than in CI so `cargo fmt` / `cargo clippy` behave the same
# locally and on a runner.
components = ["rustfmt", "clippy"]
