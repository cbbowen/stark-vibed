# Nightly is required by one dependency: `history` uses
# #![feature(associated_type_defaults)]. Nothing in this workspace needs it —
# `generic_const_exprs` went with the spline-fit crate (CLAUDE.md) — so if
# `history` ever lands on stable, so does Stark.
[toolchain]
channel = "nightly"
targets = ["wasm32-unknown-unknown"]
# Pinned here rather than in CI so `cargo fmt` / `cargo clippy` behave the same
# locally and on a runner.
components = ["rustfmt", "clippy"]
