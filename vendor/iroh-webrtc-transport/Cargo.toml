# Vendored from https://github.com/SuddenlyHazel/iroh-webrtc-transport.git
# (crates/iroh-webrtc-transport, commit fdb511da1650600dba5b97e04880b1b9aa2738a6).
# Local changes: bumped the iroh stack from 0.98 to 1.0 (iroh, iroh-base,
# noq-udp, n0-watcher) and relaxed the wasm-bindgen pin to unify with stark-ui.
# See VENDORING.md.
[package]
name = "iroh-webrtc-transport"
version = "0.1.0-alpha.2"
edition = "2024"
description = "WebRTC-backed custom transport primitives for Iroh"
readme = "README.md"
publish = false
license = "MIT"
repository = "https://github.com/SuddenlyHazel/iroh-webrtc-transport"
homepage = "https://github.com/SuddenlyHazel/iroh-webrtc-transport"
documentation = "https://docs.rs/iroh-webrtc-transport"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["browser", "native"]
browser = ["browser-main-thread"]
browser-main-thread = ["dep:js-sys", "dep:serde-wasm-bindgen", "dep:tracing-subscriber", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:web-sys"]
native = ["dep:webrtc"]

[dependencies]
anyhow = "1"
blake3 = { version = "1", default-features = false }
bytes = "1"
iroh = { version = "1", default-features = false, features = ["tls-ring", "unstable-custom-transports"] }
iroh-base = "1"
n0-future = "0.3"
n0-watcher = "1"
noq-udp = "1"
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = { version = "0.6", optional = true }
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "rt", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"], optional = true }

[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies.webrtc]
version = "0.17.1"
optional = true

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "rt", "rt-multi-thread", "sync", "time"] }
# Spike (tests/single_endpoint_webrtc.rs): drive real WebRTC on a single normal
# iroh endpoint outside the facade. `test-utils` gives a local relay server.
iroh = { version = "1", default-features = false, features = ["tls-ring", "unstable-custom-transports", "test-utils"] }
anyhow = "1"
n0-future = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies.web-sys]
version = "0.3"
optional = true
features = [
  "BinaryType",
  "console",
  "ErrorEvent",
  "Event",
  "EventTarget",
  "MessageEvent",
  "RtcConfiguration",
  "RtcDataChannel",
  "RtcDataChannelEvent",
  "RtcDataChannelInit",
  "RtcDataChannelState",
  "RtcDataChannelType",
  "RtcIceCandidate",
  "RtcIceCandidateInit",
  "RtcPeerConnection",
  "RtcPeerConnectionIceEvent",
  "RtcSdpType",
  "RtcSessionDescriptionInit",
]
