# Vendored from https://github.com/anchalshivank/iroh-webrtc-transport.git
# (commit a982968c07536b6033be0ca5e69e5c151b1410ac). Library only — the upstream
# demo binaries, examples, browser demo crate, and WebSocket signaling module
# are not vendored, which drops the nym/axum/tungstenite dependency tail.
# Local changes: ported iroh 0.97 -> 1.0; str0m crypto backend swapped from
# aws-lc-rs to rust-crypto (no NASM on Windows); NEW wasm implementation of the
# peer + attach path (`src/web_peer.rs`, browser RTCPeerConnection — upstream
# has no browser-side custom transport at all). See VENDORING.md.
#
# NOTE: this arrived as a second, experimental vendoring beside a
# SuddenlyHazel-derived crate of the same name. The experiment in tests/
# settled its fate: that sibling is gone, and THIS crate is stark-net's
# production dependency (crates/stark-net/Cargo.toml, behind the default-on
# `webrtc` feature). Workspace-excluded like the rest of vendor/.
[package]
name = "iroh-webrtc-transport"
version = "0.1.0"
edition = "2024"
publish = false
# Upstream has NO license file or license field as of the vendored commit.
# Flagged in VENDORING.md; must be resolved before this ships in a release.

[dependencies]
anyhow = "1"
async-trait = "0.1"
iroh = { version = "1", default-features = false, features = ["tls-ring", "unstable-custom-transports"] }
iroh-base = "1"
n0-watcher = "1"
noq-udp = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "sync"] }
tracing = "0.1"

# Native WebRTC stack: str0m (sans-IO) driven on a local UDP socket.
[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dependencies]
if-addrs = "0.13"
str0m = { version = "0.19", default-features = false }
str0m-rust-crypto = "0.4"
tokio = { version = "1", default-features = false, features = ["net", "rt", "time"] }

# Browser WebRTC stack: the browser's own RTCPeerConnection via web-sys.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies.web-sys]
version = "0.3"
features = [
  "Event",
  "MessageEvent",
  "RtcConfiguration",
  "RtcDataChannel",
  "RtcDataChannelEvent",
  "RtcDataChannelState",
  "RtcDataChannelType",
  "RtcIceGatheringState",
  "RtcPeerConnection",
  "RtcSdpType",
  "RtcSessionDescription",
  "RtcSessionDescriptionInit",
]

[dev-dependencies]
# `test-utils` provides the local relay server for the spike tests.
iroh = { version = "1", default-features = false, features = ["tls-ring", "unstable-custom-transports", "test-utils"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# This crate is workspace-excluded, so the root manifest's [patch] does not
# apply here; declare the same substitution. See vendor/iroh/VENDORING.md.
[patch.crates-io]
iroh = { path = "../iroh" }
