# Vendored from https://github.com/anchalshivank/iroh-webrtc-transport.git
# (commit a982968c07536b6033be0ca5e69e5c151b1410ac). Library only — the upstream
# demo binaries, examples, browser demo crate, and WebSocket signaling module
# are not vendored, which drops the nym/axum/tungstenite dependency tail.
# Local changes: ported iroh 0.97 -> 1.0 and swapped the str0m crypto backend
# from aws-lc-rs to rust-crypto (pure Rust: no NASM on Windows, and the only
# backend with a path to wasm). See VENDORING.md.
#
# NOTE: this is a second, EXPERIMENTAL vendoring of a crate by the same name;
# vendor/iroh-webrtc-transport (SuddenlyHazel's) is the one stark-net currently
# uses. This one is standalone (workspace-excluded, not a path dep of anything)
# until the experiment in tests/ decides its fate.
[package]
name = "iroh-webrtc-transport"
version = "0.1.0"
edition = "2024"
publish = false
# Upstream has NO license file or license field as of the vendored commit.
# Flagged in VENDORING.md; must be resolved before this ships in a release.

[dependencies]
anyhow = "1"
async-trait = "0.1"
if-addrs = "0.13"
iroh = { version = "1", default-features = false, features = ["tls-ring", "unstable-custom-transports"] }
iroh-base = "1"
n0-watcher = "1"
noq-udp = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
str0m = { version = "0.19", default-features = false }
str0m-rust-crypto = "0.4"
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[dev-dependencies]
# `test-utils` provides the local relay server for the spike tests.
iroh = { version = "1", default-features = false, features = ["tls-ring", "unstable-custom-transports", "test-utils"] }
tokio = { version = "1", default-features = false, features = ["macros", "rt-multi-thread", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# This crate is workspace-excluded, so the root manifest's [patch] does not
# apply here; declare the same substitution. See vendor/iroh/VENDORING.md.
[patch.crates-io]
iroh = { path = "../iroh" }
